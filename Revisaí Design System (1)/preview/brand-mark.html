<!doctype html><html><head><meta charset="utf-8" /><title>Brand mark</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px; background: var(--bg); font-family: var(--font-sans); display:flex; align-items:center; gap: 28px; }
  .group { display:flex; align-items:center; gap: 12px; padding: 14px 18px; border-radius: 16px; }
  .a { background: var(--surface); border:1px solid var(--border); }
  .b { background: #F8FAFC; border:1px solid #E2E8F0; }
  .b .word { color: #0F172A; }
  .word { font-weight: 700; font-size: 22px; letter-spacing: -0.02em; color: var(--fg-1); }
  img { display:block; }
</style></head><body>
<div class="group a"><img src="../assets/revisai-mark.svg" width="40" height="40" /><span class="word">Revisaí</span></div>
<div class="group b"><img src="../assets/revisai-mark.svg" width="40" height="40" /><span class="word">Revisaí</span></div>
<div class="group" style="background:#D45C3A"><img src="../assets/revisai-mark.svg" width="36" height="36" style="filter:brightness(0) invert(1) opacity(.95)" /><span class="word" style="color:#fff">Revisaí</span></div>
</body></html>
