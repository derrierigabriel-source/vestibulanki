<!doctype html><html><head><meta charset="utf-8" /><title>Deck card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:20px; background: var(--bg); font-family: var(--font-sans); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .deck { position:relative; background: var(--surface); border:1px solid var(--border); border-radius: 16px; padding: 16px; transition: transform 200ms var(--ease-out), box-shadow 200ms; overflow:hidden; }
  .deck:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(212,92,58,0.18); }
  .stripe { position:absolute; left:0; right:0; top:0; height:3px; }
  .head { display:flex; gap:12px; align-items:center; margin-bottom: 12px; }
  .icon { width:36px; height:36px; border-radius: 10px; display:flex; align-items:center; justify-content:center; }
  .name { font-weight:600; color: var(--fg-1); font-size: 14px; }
  .cat { font-size: 11px; color: var(--fg-3); }
  .meta { display:flex; gap:10px; font-size: 11px; color: var(--fg-3); margin-bottom: 10px; }
  .meta b { color: var(--fg-2); font-weight:500; }
  .progress { display:flex; gap:2px; height:4px; border-radius:99px; overflow:hidden; background: var(--border-subtle); }
  .seg { height:100%; }
</style></head><body>
<div class="grid">
  <div class="deck">
    <div class="stripe" style="background:#3B82F6"></div>
    <div class="head"><div class="icon" style="background:rgba(59,130,246,0.16);color:#60A5FA;">📘</div><div><div class="name">Matemática Básica</div><div class="cat">Exatas</div></div></div>
    <div class="meta"><span><b>10</b> cards</span><span style="color:#F87171">3 urgentes</span><span style="color:#34D399">5 ✓</span></div>
    <div class="progress"><div class="seg" style="width:30%;background:#EF4444"></div><div class="seg" style="width:20%;background:#F59E0B"></div><div class="seg" style="width:50%;background:#10B981"></div></div>
  </div>
  <div class="deck">
    <div class="stripe" style="background:#D45C3A"></div>
    <div class="head"><div class="icon" style="background:rgba(212,92,58,0.16);color:#E07A5A;">🔥</div><div><div class="name">Física</div><div class="cat">Exatas</div></div></div>
    <div class="meta"><span><b>10</b> cards</span><span style="color:#F87171">5 urgentes</span></div>
    <div class="progress"><div class="seg" style="width:50%;background:#EF4444"></div><div class="seg" style="width:30%;background:#F59E0B"></div><div class="seg" style="width:20%;background:#10B981"></div></div>
  </div>
</div>
</body></html>
