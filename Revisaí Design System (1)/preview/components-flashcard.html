<!doctype html><html><head><meta charset="utf-8" /><title>Flashcard</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:18px; background: var(--bg); font-family: var(--font-sans); }
  .progress { display:flex; justify-content:space-between; font-size:11px; color:var(--fg-3); margin-bottom:6px; }
  .pchip { padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--fg-2); font-size: 10px; }
  .bar { height:4px; background: var(--border-subtle); border-radius:99px; overflow:hidden; margin-bottom: 12px; }
  .bar > div { height:100%; width:42%; background: linear-gradient(90deg, var(--accent), var(--accent-hover)); border-radius: 99px; }
  .card { background: linear-gradient(180deg, #11131C 0%, #0B0C13 100%); border:1px solid var(--border); border-radius: 18px; padding: 22px; }
  .q { font-family: var(--font-serif); font-size: 22px; line-height:1.35; color: var(--fg-1); margin-bottom: 16px; }
  .opts { display:grid; gap: 8px; }
  .opt { display:flex; align-items:center; gap:10px; padding: 10px 12px; border-radius: 10px; border:1px solid var(--border-strong); color: var(--fg-2); font-size: 13px; cursor:pointer; }
  .opt b { color: var(--fg-3); width: 14px; font-weight:600; }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--fg-1); }
</style></head><body>
<div class="progress"><span>Card 4 de 10</span><span class="pchip">Médio</span></div>
<div class="bar"><div></div></div>
<div class="card">
  <div class="q">Qual é o resultado de 2³ × 2²?</div>
  <div class="opts">
    <div class="opt sel"><b>A)</b> 2⁵</div>
    <div class="opt"><b>B)</b> 2⁶</div>
    <div class="opt"><b>C)</b> 4⁵</div>
    <div class="opt"><b>D)</b> 2¹</div>
  </div>
</div>
</body></html>
