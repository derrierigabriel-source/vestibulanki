<!doctype html><html><head><meta charset="utf-8" /><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:20px; background: var(--bg); font-family: var(--font-sans); display:grid; grid-template-columns:1fr 1fr; gap: 12px; }
  .field { position: relative; }
  .field input { width:100%; box-sizing:border-box; background: var(--surface); border:1px solid var(--border-strong); border-radius:12px; padding: 12px 14px 12px 38px; color:var(--fg-1); font: inherit; font-size: 14px; outline: none; transition: border-color 120ms; }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field input::placeholder { color: var(--fg-4); }
  .field svg { position:absolute; left:12px; top:50%; transform: translateY(-50%); color: var(--fg-3); }
  .chip { display:inline-flex; align-items:center; gap:6px; padding: 4px 10px; border-radius:9999px; font-size:11px; font-weight:600; background: var(--accent-soft); color: var(--accent); border:1px solid rgba(212,92,58,0.32); }
  .chip-2 { background: var(--accent-2-soft); color: var(--accent-2); border-color: rgba(13,148,136,0.32); }
</style></head><body>
<div class="field">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m22 6-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
  <input type="email" placeholder="seu@email.com" value="ana@revisai.com" />
</div>
<div class="field">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  <input type="password" placeholder="Senha" value="••••••••" />
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
  <span class="chip">Exatas</span>
  <span class="chip chip-2">Raciocínio</span>
  <span class="chip" style="background:rgba(59,130,246,0.10);color:#60A5FA;border-color:rgba(59,130,246,0.32);">Humanas</span>
  <span class="chip" style="background:rgba(245,158,11,0.10);color:#FBBF24;border-color:rgba(245,158,11,0.32);">5 urgentes</span>
</div>
</body></html>
