<!doctype html><html><head><meta charset="utf-8" /><title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px; background: var(--bg); font-family: var(--font-sans); }
  .grid { display:grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
  .tile { background: var(--surface); border:1px solid var(--border); border-radius: 14px; padding: 18px; height: 110px; display:flex; flex-direction:column; justify-content:space-between; }
  .name { font-size: 12px; color: var(--fg-1); font-weight: 600; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .e1 { box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 1px 2px rgba(0,0,0,0.4); }
  .e2 { box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 24px rgba(0,0,0,0.45); }
  .e3 { box-shadow: 0 0 0 1px rgba(212,92,58,0.40), 0 12px 40px rgba(212,92,58,0.25); }
</style></head><body>
<div class="grid">
  <div class="tile e1"><span class="name">Elevation 1</span><span class="meta">card · resting</span></div>
  <div class="tile e2"><span class="name">Elevation 2</span><span class="meta">menu · modal · float</span></div>
  <div class="tile e3"><span class="name">Glow</span><span class="meta">accent focus / hover</span></div>
</div>
</body></html>
