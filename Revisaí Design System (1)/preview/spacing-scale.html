<!doctype html><html><head><meta charset="utf-8" /><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:20px; background: var(--bg); font-family: var(--font-sans); color: var(--fg-2); }
  .row { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .bar { background: var(--accent); height: 10px; border-radius: 3px; }
  .name { width: 64px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); margin-left:auto; }
</style></head><body>
<div class="row"><span class="name">sp-1</span><div class="bar" style="width:4px"></div><span class="px">4</span></div>
<div class="row"><span class="name">sp-2</span><div class="bar" style="width:8px"></div><span class="px">8</span></div>
<div class="row"><span class="name">sp-3</span><div class="bar" style="width:12px"></div><span class="px">12</span></div>
<div class="row"><span class="name">sp-4</span><div class="bar" style="width:16px"></div><span class="px">16</span></div>
<div class="row"><span class="name">sp-5</span><div class="bar" style="width:20px"></div><span class="px">20</span></div>
<div class="row"><span class="name">sp-6</span><div class="bar" style="width:24px"></div><span class="px">24</span></div>
<div class="row"><span class="name">sp-8</span><div class="bar" style="width:32px"></div><span class="px">32</span></div>
<div class="row"><span class="name">sp-10</span><div class="bar" style="width:40px"></div><span class="px">40</span></div>
<div class="row"><span class="name">sp-12</span><div class="bar" style="width:48px"></div><span class="px">48</span></div>
<div class="row"><span class="name">sp-16</span><div class="bar" style="width:64px"></div><span class="px">64</span></div>
</body></html>
