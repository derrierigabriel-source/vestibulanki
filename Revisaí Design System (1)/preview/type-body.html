<!doctype html><html><head><meta charset="utf-8" /><title>Type — Body</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:20px; background: var(--bg); }
  .label { font-family: var(--font-mono); font-size:10px; color: var(--fg-4); display:block; margin-bottom:6px; letter-spacing:.06em; }
  .row { margin-bottom: 16px; }
  .eyebrow-demo { font-size:11px; letter-spacing:.10em; text-transform:uppercase; color:var(--fg-3); font-weight:500; }
</style></head><body>
<div class="row"><span class="label">H3 · INTER 500 · 22/1.35</span>
  <div style="font-size:22px;font-weight:500;color:var(--fg-1);">Cards estudados hoje</div></div>
<div class="row"><span class="label">BODY · INTER 400 · 15/1.55</span>
  <div style="font-size:15px;color:var(--fg-2);line-height:1.55;">Acertou muito mas sempre marcou como difícil — possível chute. Revise estes cards na próxima sessão.</div></div>
<div class="row"><span class="label">SMALL · INTER 400 · 13/1.55</span>
  <div style="font-size:13px;color:var(--fg-3);">12 cards · 5 urgentes · ICE 87%</div></div>
<div class="row"><span class="label">EYEBROW · INTER 500 · 11 · UPPER · +0.10em</span>
  <div class="eyebrow-demo">Próxima sessão</div></div>
</body></html>
