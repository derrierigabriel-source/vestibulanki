<!doctype html><html><head><meta charset="utf-8" /><title>Type — Serif & Mono</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px; background: var(--bg); }
  .label { font-family: var(--font-mono); font-size:10px; color: var(--fg-4); display:block; margin-bottom:6px; letter-spacing:.06em; }
  .row { margin-bottom: 16px; }
  .card-face { background: var(--surface); border:1px solid var(--border); border-radius: 16px; padding: 22px; }
</style></head><body>
<div class="row"><span class="label">FLASHCARD FACE · INSTRUMENT SERIF 400 · 22/1.4</span>
  <div class="card-face"><span style="font-family:var(--font-serif);font-size:22px;line-height:1.4;color:var(--fg-1);">Qual é o resultado de 2³ × 2²?</span></div></div>
<div class="row"><span class="label">MONO / TIMER · UI-MONO 700 · 18 · TABULAR</span>
  <div style="font-family:var(--font-mono);font-weight:700;font-size:18px;color:var(--fg-1);font-variant-numeric:tabular-nums;">02:34:18</div></div>
</body></html>
