<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Revisaí · UI Kit</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Login.jsx" data-presets="react"></script>
<script type="text/babel" src="Shell.jsx" data-presets="react"></script>
<script type="text/babel" src="Dashboard.jsx" data-presets="react"></script>
<script type="text/babel" src="Decks.jsx" data-presets="react"></script>
<script type="text/babel" src="Study.jsx" data-presets="react"></script>
<script type="text/babel" src="Vestibular.jsx" data-presets="react"></script>
<script type="text/babel" data-presets="react">
const SCREENS = [
  { id: "login",      label: "Login" },
  { id: "dashboard",  label: "Dashboard" },
  { id: "decks",      label: "Baralhos" },
  { id: "study",      label: "Flashcard" },
  { id: "vestibular", label: "Vestibular" },
  { id: "vest-low",   label: "Vest. (10min)" },
];

function App() {
  const [screen, setScreen] = React.useState("dashboard");
  const [route, setRoute] = React.useState("dashboard");

  const showApp = ["dashboard","decks","study"].includes(screen);

  return (
    <>
      <div className="kit-toolbar">
        {SCREENS.map((s) => (
          <button key={s.id} className={screen === s.id ? "is-active" : ""} onClick={() => setScreen(s.id)}>{s.label}</button>
        ))}
      </div>

      {screen === "login" && <Login onSignIn={() => setScreen("dashboard")} />}
      {screen === "vestibular" && <Vestibular onDone={() => setScreen("dashboard")} />}
      {screen === "vest-low" && <Vestibular onDone={() => setScreen("dashboard")} lowTime={true} />}

      {showApp && (
        <div className="app">
          <Sidebar route={route} setRoute={(r) => { setRoute(r); if (r === "study") setScreen("study"); else if (r === "decks") setScreen("decks"); else if (r === "vestibular") setScreen("vestibular"); else setScreen("dashboard"); }} onSignOut={() => setScreen("login")} />
          <main className="app__main">
            {screen === "dashboard" && <Dashboard />}
            {screen === "decks" && <Decks onStudy={() => setScreen("study")} />}
            {screen === "study" && <Study onDone={() => setScreen("decks")} />}
          </main>
          <BottomNav route={route} setRoute={(r) => { setRoute(r); if (r === "study") setScreen("study"); else if (r === "decks") setScreen("decks"); else if (r === "vestibular") setScreen("vestibular"); else setScreen("dashboard"); }} />
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
